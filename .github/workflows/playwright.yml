name: Playwright Live Tests
# Runs one suite on a chosen CI state. Full regression has its own workflow.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        default: run-suite-approval
        options:
          - create-spa-only
          - run-suite-approval
          - run-suite-approve-return-disapprove
          - run-suite-approve-return-disapprove-divison
          - run-suite-companion-letter
          - run-suite-disapproval
          - run-suite-disapprove-return-approve
          - run-suite-rai-approve
          - run-suite-rai-withdrawal
          - run-suite-split-approval
          - run-suite-split-intake-approval
          - run-suite-split-rai-approval
      state:
        description: CI SPA state. OH and PR are used by the regression lanes.
        type: choice
        default: MT
        options:
          - MT
          - OH
          - GA
          - GU
          - SC
          - PR
jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-suite.yml
    secrets: inherit
    with:
      command: ${{ inputs.suite == 'create-spa-only' && 'npx playwright test tests/onemac/workflow/OneMAC-new-SPA.spec.ts --project=chromium' || format('node tests/med-spa-suites/{0}.mjs', inputs.suite) }}
      state: ${{ inputs.state }}
      artifact: ${{ inputs.suite }}
      post-slack: true
