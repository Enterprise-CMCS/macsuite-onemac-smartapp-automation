name: Playwright Live Tests
on:
  workflow_dispatch:
concurrency:
  group: smart-live
  cancel-in-progress: false
jobs:
  onemac-create-spa:
    timeout-minutes: 30
    runs-on: windows-latest
    environment: live-smart
    permissions:
      contents: write
    env:
      ONEMAC_USERNAME: ${{ secrets.ONEMAC_USERNAME }}
      ONEMAC_PASSWORD: ${{ secrets.ONEMAC_PASSWORD }}
      SPA_STATE: SC
    steps:
    - uses: actions/checkout@v4
    - name: Restore SPA state from ci-state
      uses: actions/checkout@v4
      with:
        ref: ci-state
        path: playwright/.records
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium
    - name: Create new Med SPA in OneMAC
      run: npx playwright test tests/onemac/workflow/OneMAC-new-SPA.spec.ts --project=chromium
    # Runs even after a failure: a failed run may already have reserved an SPA ID that must not be reused.
    - name: Save SPA state to ci-state
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: playwright/.records
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
        git commit -m "Update CI SPA state (run ${{ github.run_id }})"
        for attempt in 1 2 3; do
          git push origin HEAD:ci-state && exit 0
          git pull --rebase origin ci-state
        done
        exit 1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
