name: Playwright Live Tests
on:
  workflow_dispatch:
concurrency:
  group: smart-live
  cancel-in-progress: false
jobs:
  smart-login-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: live-smart
    env:
      SF_INTAKE_USERNAME: ${{ secrets.SF_INTAKE_USERNAME }}
      SF_INTAKE_PASSWORD: ${{ secrets.SF_INTAKE_PASSWORD }}
      SF_INTAKE_TOTP_SECRET: ${{ secrets.SF_INTAKE_TOTP_SECRET }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium
    - name: Run SMART login smoke test
      run: npx playwright test tests/smart/smoke/smart-login.spec.ts --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
